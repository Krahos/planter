[package]
name = "planter"
version = "0.1.0"
authors = ["Sebastiano Giordano"]
description = "PlanTer is a project management application."
documentation = "https://docs.rs/planter"
keywords = ["project_management"]
license = "AGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/krahos/planter"
edition = "2024"

[dependencies]
chrono = "0.4.45"
iced = {features = ["advanced", "lazy"], version = "0.14.0"}
iced_aw = {version = "0.14.1", default-features = false, features = ["context_menu", "menu"]}
planter-core = {version = "0.0.7", features = ["serde"]}
regex = "1.13.1"
ron = "0.12"
rfd = "0.17"

[dev-dependencies]
proptest = "1.11.0"
