name: Post merge

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "**/LICENSE*"
      - "devenv.*"
      - "devenv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.87.26
        with:
          tool: cargo-llvm-cov
      - name: Generate code coverage
        run: cargo llvm-cov
